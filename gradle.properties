# Force English locale: Thai locale makes Java use the Buddhist calendar (year 25xx),
# which breaks APK zip timestamps (VerifyException in MsDosDateTimeUtils.packDate).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
